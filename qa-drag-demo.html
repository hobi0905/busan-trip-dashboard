<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>drag demo booting</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; font: 11px ui-monospace, monospace; }
  iframe { border: 0; display: block; }
  #log { position: fixed; left: 400px; top: 0; width: 700px; font: 11px ui-monospace, monospace; color: #334155; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="m390" src="index.html?trip=qa-drag-390&v=drag6" width="390" height="844"></iframe>
<div id="log">booting…</div>
<script>
(function () {
  var f = document.getElementById("m390");
  var logEl = document.getElementById("log");
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var setTitle = function (s) { document.title = s; logEl.textContent = s; };

  f.addEventListener("load", function () { boot().catch(function (e) { setTitle("ERR " + (e && e.message)); }); });

  async function boot() {
    var W = f.contentWindow, D = W.document;
    for (var i = 0; i < 60 && !D.querySelector('.nav-btn[data-tab="timeline"]'); i++) await sleep(100);

    D.querySelector('.nav-btn[data-tab="timeline"]').click();
    await sleep(600);

    await sleep(4000);   // 날씨 자동 갱신이 끝난 뒤에 시작한다
    var eb = D.getElementById("edit-mode-btn");
    if (eb && /일정 편집/.test(eb.textContent)) { eb.click(); await sleep(500); }

    var hint = D.querySelector(".tl-edit-hint");
    if (hint) {
      var absTop = hint.getBoundingClientRect().top + W.scrollY;
      W.scrollTo(0, Math.max(0, absTop - 205));
    }
    await sleep(500);

    var rows = [].slice.call(D.querySelectorAll(".tl-edit-row[data-item-id]"));
    var handle = rows[0].querySelector(".tl-drag-handle");
    var hb = handle.getBoundingClientRect();
    var x = hb.left + hb.width / 2, y0 = hb.top + hb.height / 2;
    var rowH = rows[0].getBoundingClientRect().height + 9;

    var mkTouch = function (cy) {
      return { identifier: 11, target: handle, clientX: x, clientY: cy, pageX: x, pageY: cy + W.scrollY, screenX: x, screenY: cy };
    };
    var fire = function (type, target, list) {
      var e = new W.Event(type, { bubbles: true, cancelable: true });
      e.touches = list; e.targetTouches = list; e.changedTouches = list;
      target.dispatchEvent(e);
    };

    var targetY = y0 + rowH * 3 + 24;
    fire("touchstart", handle, [mkTouch(y0)]);
    for (var s = 1; s <= 6; s++) {
      await sleep(80);
      fire("touchmove", D, [mkTouch(y0 + (targetY - y0) * (s / 6))]);
    }

    var g = D.querySelector(".tl-drag-ghost");
    var gs = g ? W.getComputedStyle(g.firstElementChild) : null;
    var gr = g ? g.getBoundingClientRect() : null;
    var orderHold = [].slice.call(D.querySelectorAll(".tl-edit-row[data-item-id]")).map(function (r) { return r.getAttribute("data-item-id"); }).join(">");
    setTitle("HOLD ghost=" + (g ? "yes" : "no") + " " + (gr ? Math.round(gr.width) + "x" + Math.round(gr.height) + "@y" + Math.round(gr.top) : "-")
      + " scale=" + (gs ? gs.transform : "-") + " | shadow=" + (gs ? gs.boxShadow : "-") + " | bg=" + (gs ? gs.backgroundColor : "-")
      + " | order=" + orderHold);

    await sleep(18000);   // 이 사이에 스크린샷 1 (들린 카드)

    var e2 = new W.Event("touchend", { bubbles: true, cancelable: true });
    e2.touches = []; e2.targetTouches = []; e2.changedTouches = [mkTouch(targetY)];
    D.dispatchEvent(e2);
    await sleep(900);

    var rows2 = [].slice.call(D.querySelectorAll(".tl-edit-row[data-item-id]"));
    setTitle("DROP order=" + rows2.map(function (r) { return r.getAttribute("data-item-id"); }).join(">")
      + " | ghostLeft=" + (D.querySelector(".tl-drag-ghost") ? "yes" : "no")
      + " | " + rows2.map(function (r) { return r.querySelector(".tl-edit-place").textContent; }).join(" > "));

    await sleep(8000);    // 이 사이에 스크린샷 2 (놓은 뒤 순서 유지)

    // 편집 완료 → 카드 시간이 새 순서대로 재배정됐는지 보여 준다
    var eb2 = D.getElementById("edit-mode-btn");
    if (eb2) eb2.click();
    await sleep(900);
    var cards = [].slice.call(D.querySelectorAll("#timeline-list .card .tl-time")).map(function (e) { return e.textContent; });
    var places = [].slice.call(D.querySelectorAll("#timeline-list .card .tl-place")).map(function (e) { return e.textContent; });
    var pins = [].slice.call(D.querySelectorAll("#day-map .map-pin-num, #day-map .pin-num")).map(function (e) { return e.textContent; });
    setTitle("FINAL times=" + cards.join(",") + " | " + places.map(function (p, i) { return cards[i] + " " + p; }).join(" > ")
      + " | pins=" + pins.join(","));
  }
})();
</script>
</body>
</html>
