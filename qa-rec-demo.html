<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>rec demo booting</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  iframe { border: 0; display: block; }
  #log { position: fixed; left: 400px; top: 0; width: 760px; font: 11px ui-monospace, monospace; color: #334155; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="m390" src="index.html?trip=qa-rec-390&v=rec2" width="390" height="844"></iframe>
<div id="log">booting…</div>
<script>
(function () {
  var f = document.getElementById("m390");
  var logEl = document.getElementById("log");
  var phase = (new URLSearchParams(location.search)).get("phase") || "spot";
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var setTitle = function (s) { document.title = s; logEl.textContent = s; };

  f.addEventListener("load", function () { boot().catch(function (e) { setTitle("ERR " + (e && e.message)); }); });

  function clickText(root, text) {
    var el = [].slice.call(root.querySelectorAll("button")).find(function (b) { return b.textContent.indexOf(text) >= 0; });
    if (el) el.click();
    return el;
  }

  async function boot() {
    var W = f.contentWindow, D = W.document;
    for (var i = 0; i < 60 && !D.querySelector('.nav-btn[data-tab="recommend"]'); i++) await sleep(100);
    await sleep(3500);

    D.querySelector('.nav-btn[data-tab="recommend"]').click();
    await sleep(700);

    if (phase === "route") {
      clickText(D, "2. 신규 루트");
      await sleep(500);
      D.getElementById("route-dest").value = "서울";
      D.getElementById("route-start").value = "2027-03-06";
      D.getElementById("route-end").value = "2027-03-08";
      await sleep(300);
      clickText(D, "폭염 실내위주");
      await sleep(400);
      clickText(D, "AI 추천 루트 생성하기");
      await sleep(3000);
      var box = D.getElementById("route-results");
      if (box) { var r = box.getBoundingClientRect(); W.scrollBy(0, Math.round(r.top - 150)); }
      await sleep(600);
      var names = [].slice.call(box.querySelectorAll("div")).map(function (n) { return n.textContent; }).join(" ");
      var items = [].slice.call(box.querySelectorAll("strong")).map(function (n) { return n.parentElement.textContent.replace(/\s+/g, " "); });
      setTitle("ROUTE items=" + items.join(" | "));
    } else {
      D.getElementById("rec-purpose").value = "산책";
      clickText(D, "폭염 실내위주");
      await sleep(400);
      clickText(D, "장소 5곳 추천 받기");
      await sleep(2600);
      var res = D.getElementById("rec-results");
      if (res) { var rb = res.getBoundingClientRect(); W.scrollBy(0, Math.round(rb.top - 60)); }
      await sleep(600);
      var picks = [].slice.call(res.querySelectorAll(".rec-pick")).map(function (c) {
        var card = c.closest(".card");
        var t = card.querySelector("div[style*='font-weight:800']");
        return t ? t.textContent.replace(/\s+/g, " ").trim() : "";
      });
      var note = (res.querySelector(".card") || {}).textContent || "";
      setTitle("SPOT " + picks.join(" | ") + " || note=" + note.replace(/\s+/g, " ").slice(0, 80));
    }
  }
})();
</script>
</body>
</html>
