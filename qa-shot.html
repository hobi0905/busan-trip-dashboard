<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모바일 390 QA · 구간 캡처</title>
<style>
  html, body { margin: 0; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
  .bar { color: #e2e8f0; font-size: 12px; font-weight: 700; padding: 6px 10px; }
  .win { width: 390px; height: 844px; overflow: hidden; margin: 0 auto; background: #fff; position: relative; }
  .win iframe { width: 390px; height: 2950px; border: 0; display: block; }
</style>
</head>
<body>
  <div class="bar" id="bar">390px 폭 · 구간 캡처</div>
  <div class="win" id="win"><iframe id="qa-frame" src="./?trip=qa-hotel-auto-20261120"></iframe></div>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var off = Number(p.get("off") || 0);
      var day = Number(p.get("day") || 0);
      var frame = document.getElementById("qa-frame");
      if (p.get("trip")) frame.src = "./?trip=" + encodeURIComponent(p.get("trip")) + "&cb=" + Date.now();
      frame.style.marginTop = (-off) + "px";
      document.getElementById("bar").textContent = "390px 폭 · offset " + off + "px" + (day ? " · " + day + "일차" : "");
      if (day) {
        frame.addEventListener("load", function () {
          setTimeout(function () {
            try {
              var doc = frame.contentDocument;
              var btns = [].slice.call(doc.querySelectorAll(".day-btn"));
              var target = btns.filter(function (b) { return (b.textContent || "").trim().indexOf(day + "일차") === 0; })[0];
              if (target) target.click();
              doc.documentElement.scrollTop = 0;
              doc.body.scrollTop = 0;
            } catch (e) {}
          }, 600);
        });
      }
    })();
  </script>
</body>
</html>
